<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medium Daily Digest</title>
<style>
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-dim: #1f6feb;
    --tag-bg: #1a2332;
    --tag-text: #58a6ff;
    --hover: #1c2129;
    --gold: #e3b341;
    --green: #3fb950;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }
  header {
    text-align: center;
    padding: 3rem 0 2rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2.5rem;
  }
  header h1 {
    font-size: 2.2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 0.5rem;
  }
  header h1 span { color: var(--accent); }
  header .date {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin-top: 0.5rem;
  }
  header .count {
    display: inline-block;
    background: var(--accent-dim);
    color: #fff;
    padding: 0.15rem 0.7rem;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 0.5rem;
  }
  .article {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.25rem;
    transition: border-color 0.2s, background 0.2s;
  }
  .article:hover {
    border-color: var(--accent-dim);
    background: var(--hover);
  }
  .article-num {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 0.4rem;
  }
  .article h2 {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
    line-height: 1.4;
  }
  .article h2 a {
    color: var(--text);
    text-decoration: none;
  }
  .article h2 a:hover { color: var(--accent); }
  .article .meta {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-bottom: 0.75rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .article .meta span { display: flex; align-items: center; gap: 0.3rem; }
  .article .summary {
    color: var(--text-muted);
    font-size: 0.92rem;
    line-height: 1.65;
    margin-bottom: 0.75rem;
  }
  .article .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
  }
  .article .tag {
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 0.2rem 0.6rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .article .read-more {
    display: inline-block;
    margin-top: 0.75rem;
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
  }
  .article .read-more:hover { text-decoration: underline; }
  .key-takeaway {
    background: linear-gradient(135deg, #1a2332 0%, #0d2137 100%);
    border: 1px solid var(--accent-dim);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.25rem;
    font-size: 0.9rem;
  }
  .key-takeaway strong { color: var(--accent); }
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 2rem 0;
    border-top: 1px solid var(--border);
    margin-top: 2rem;
  }
  footer a { color: var(--accent); text-decoration: none; }
  .loading {
    text-align: center;
    padding: 4rem 0;
    color: var(--text-muted);
  }
  @media (max-width: 600px) {
    .container { padding: 1rem; }
    header h1 { font-size: 1.6rem; }
    .article { padding: 1.25rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📰 Medium <span>Daily Digest</span></h1>
    <p class="date" id="digest-date">Cargando...</p>
    <span class="count" id="article-count">15 artículos</span>
  </header>

  <div id="articles-container">
    <div class="loading">⏳ Cargando digest...</div>
  </div>

  <footer>
    <p>Generado automáticamente por <a href="https://github.com/udeope/medium-digest">Hermes Agent</a> · Artículos curados de Medium Daily Digest</p>
  </footer>
</div>

<!-- DATA_PLACEHOLDER -->
<script>
// ── Digest data injected by cron job ──
const DIGEST = {
  date: "PRÓXIMAMENTE",
  articles: []
};
</script>
<!-- END_DATA_PLACEHOLDER -->

<script>
(function() {
  const d = DIGEST;
  document.getElementById('digest-date').textContent = d.date;
  document.getElementById('article-count').textContent = d.articles.length + ' artículos';

  if (!d.articles.length) {
    document.getElementById('articles-container').innerHTML =
      '<div class="loading">📭 Aún no hay artículos. ¡El primer digest llegará pronto!</div>';
    return;
  }

  let html = '';
  d.articles.forEach((a, i) => {
    html += '<div class="article">';
    html += '<div class="article-num">Artículo ' + (i + 1) + '</div>';
    html += '<h2><a href="' + (a.url || '#') + '" target="_blank" rel="noopener">' + (a.title || 'Sin título') + '</a></h2>';
    html += '<div class="meta">';
    if (a.author) html += '<span>✍️ ' + a.author + '</span>';
    if (a.readTime) html += '<span>⏱️ ' + a.readTime + '</span>';
    html += '</div>';
    if (a.summary) html += '<div class="summary">' + a.summary + '</div>';
    if (a.keyTakeaway) html += '<div class="key-takeaway"><strong>💡 Clave:</strong> ' + a.keyTakeaway + '</div>';
    if (a.tags && a.tags.length) {
      html += '<div class="tags">';
      a.tags.forEach(t => { html += '<span class="tag">' + t + '</span>'; });
      html += '</div>';
    }
    if (a.url) html += '<a class="read-more" href="' + a.url + '" target="_blank" rel="noopener">Leer artículo completo →</a>';
    html += '</div>';
  });
  document.getElementById('articles-container').innerHTML = html;
})();
</script>
</body>
</html>
